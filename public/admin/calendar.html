<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BaltazarTV Admin - Calendar</title>

    <!-- Google Font: Source Sans Pro -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- AdminLTE -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <!-- FullCalendar -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css"
    />
    <!-- Admin Styles -->
    <link rel="stylesheet" href="assets/css/admin.css" />
  </head>
  <body class="hold-transition sidebar-mini layout-fixed">
    <div class="wrapper">
      <!-- Navbar -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button"
              ><i class="fas fa-bars"></i
            ></a>
          </li>
        </ul>
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="#" id="logoutLink">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>
          </li>
        </ul>
      </nav>

      <!-- Main Sidebar Container -->
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="/admin/index.html" class="brand-link">
          <span class="brand-text font-weight-light">BaltazarTV Admin</span>
        </a>
        <div class="sidebar">
          <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="info">
              <a href="#" class="d-block" id="userEmail">Admin User</a>
            </div>
          </div>
          <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column">
              <li class="nav-item">
                <a href="/admin/index.html" class="nav-link">
                  <i class="nav-icon fas fa-tachometer-alt"></i>
                  <p>Dashboard</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/calendar.html" class="nav-link active">
                  <i class="nav-icon fas fa-calendar"></i>
                  <p>Calendar</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/users.html" class="nav-link">
                  <i class="nav-icon fas fa-users"></i>
                  <p>Users</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/schedules.html" class="nav-link">
                  <i class="nav-icon fas fa-calendar-alt"></i>
                  <p>Schedules</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/games.html" class="nav-link">
                  <i class="nav-icon fas fa-calendar-check"></i>
                  <p>Games</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/subscriptions.html" class="nav-link">
                  <i class="nav-icon fas fa-crown"></i>
                  <p>Subscriptions</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/tutorials.html" class="nav-link">
                  <i class="nav-icon fas fa-book"></i>
                  <p>Tutorials</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/stripe-products.html" class="nav-link">
                  <i class="nav-icon fas fa-credit-card"></i>
                  <p>Stripe Products</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="/admin/messages.html" class="nav-link">
                  <i class="nav-icon fas fa-comments"></i>
                  <p>
                    Messages
                    <span
                      class="badge badge-danger ml-2"
                      id="unreadBadge"
                      style="display: none"
                      >0</span
                    >
                  </p>
                </a>
              </li>
              <!-- Configuration - Commented out for now, will be used later
          <li class="nav-item">
            <a href="/admin/config.html" class="nav-link">
              <i class="nav-icon fas fa-cog"></i>
              <p>Configuration</p>
            </a>
          </li>
          -->
              <li class="nav-item">
                <a href="/admin/audit.html" class="nav-link">
                  <i class="nav-icon fas fa-history"></i>
                  <p>Audit Logs</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Content Wrapper -->
      <div class="content-wrapper">
        <div class="content-header">
          <div class="container-fluid">
            <div class="row mb-2">
              <div class="col-sm-6">
                <h1 class="m-0">Calendar</h1>
              </div>
              <div class="col-sm-6">
                <div class="float-right">
                  <button class="btn btn-primary" onclick="loadCalendar()">
                    <i class="fas fa-sync"></i> Refresh
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <section class="content">
          <div class="container-fluid">
            <div class="row">
              <div class="col-md-12">
                <div class="card">
                  <div class="card-header">
                    <h3 class="card-title">Games Calendar</h3>
                    <div class="card-tools">
                      <button
                        class="btn btn-sm btn-primary"
                        onclick="calendar.gotoToday()"
                      >
                        <i class="fas fa-calendar-day"></i> Today
                      </button>
                      <button
                        class="btn btn-sm btn-secondary"
                        onclick="calendar.prev()"
                      >
                        <i class="fas fa-chevron-left"></i> Prev
                      </button>
                      <button
                        class="btn btn-sm btn-secondary"
                        onclick="calendar.next()"
                      >
                        Next <i class="fas fa-chevron-right"></i>
                      </button>
                      <select
                        class="form-control form-control-sm d-inline-block"
                        id="calendarView"
                        style="width: auto; margin-left: 10px"
                        onchange="changeCalendarView()"
                      >
                        <option value="dayGridMonth">Month</option>
                        <option value="timeGridWeek">Week</option>
                        <option value="timeGridDay">Day</option>
                        <option value="listWeek">List</option>
                      </select>
                    </div>
                  </div>
                  <div class="card-body">
                    <div id="calendarContainer"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- Game Details Modal -->
      <div class="modal fade" id="gameDetailsModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Game Details</h5>
              <button type="button" class="close" data-dismiss="modal">
                <span>&times;</span>
              </button>
            </div>
            <div class="modal-body" id="gameDetailsModalBody">
              <!-- Content will be populated by JavaScript -->
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-dismiss="modal"
              >
                Close
              </button>
              <button
                type="button"
                class="btn btn-primary"
                id="gameDetailsViewBtn"
                style="display: none"
                onclick="viewGameDetails()"
              >
                View Game Details
              </button>
            </div>
          </div>
        </div>
      </div>

      <footer class="main-footer">
        <strong>Copyright &copy; 2025 BaltazarTV.</strong>
      </footer>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE App -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- WebSocket Manager -->
    <script src="assets/js/websocket.js"></script>
    <!-- WebSocket Status Indicator -->
    <script src="assets/js/websocket-status.js"></script>
    <!-- Auth Utilities -->
    <script src="assets/js/auth.js"></script>
    <!-- Common Utilities -->
    <script src="assets/js/timezone-utils.js"></script>
    <script src="assets/js/common.js"></script>
    <!-- API Client -->
    <script src="assets/js/api.js"></script>
    <!-- Calendar Script -->
    <script src="assets/js/calendar.js"></script>
  </body>
</html>
